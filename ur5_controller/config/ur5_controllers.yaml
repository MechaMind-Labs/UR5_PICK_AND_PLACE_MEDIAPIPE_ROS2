controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Holds the 5 mimic joints in Ignition physics so they don't fly apart.
    # Commanded by gripper_mimic_controller.py which reads /joint_states
    # and computes each mimic joint's position from finger_joint.
    gripper_mimic_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ── ARM ──────────────────────────────────────────────────────────────────────
arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces: [position]
    state_interfaces:   [position, velocity]
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      shoulder_pan_joint:  { trajectory: 0.0, goal: 0.0 }
      shoulder_lift_joint: { trajectory: 0.0, goal: 0.0 }
      elbow_joint:         { trajectory: 0.0, goal: 0.0 }
      wrist_1_joint:       { trajectory: 0.0, goal: 0.0 }
      wrist_2_joint:       { trajectory: 0.0, goal: 0.0 }
      wrist_3_joint:       { trajectory: 0.0, goal: 0.0 }

# ── GRIPPER (actuated finger_joint only) ─────────────────────────────────────
gripper_controller:
  ros__parameters:
    joints: [finger_joint]
    command_interfaces: [position]
    state_interfaces:   [position]
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      finger_joint: { trajectory: 0.0, goal: 0.0 }

# ── GRIPPER MIMIC (5 mimic joints — held by gripper_mimic_controller.py) ─────
gripper_mimic_controller:
  ros__parameters:
    joints:
      - left_inner_knuckle_joint
      - left_inner_finger_joint
      - right_inner_knuckle_joint
      - right_inner_finger_joint
      - right_outer_knuckle_joint
    command_interfaces: [position]
    state_interfaces:   [position]
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      left_inner_knuckle_joint:  { trajectory: 0.0, goal: 0.0 }
      left_inner_finger_joint:   { trajectory: 0.0, goal: 0.0 }
      right_inner_knuckle_joint: { trajectory: 0.0, goal: 0.0 }
      right_inner_finger_joint:  { trajectory: 0.0, goal: 0.0 }
      right_outer_knuckle_joint: { trajectory: 0.0, goal: 0.0 }
